name: ci-s001

on:
  pull_request:
    paths:
      - ".github/workflows/ci-s001.yml"
      - "secuencia/s001/**"
      - "!secuencia/s001/script/**"
      - "!secuencia/s001/ejemplos/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci-s001.yml"
      - "secuencia/s001/**"
      - "!secuencia/s001/script/**"
      - "!secuencia/s001/ejemplos/**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: secuencia/s001

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check src tests

      - name: Run Black
        run: black --check src tests

      - name: Validate docstrings
        run: pydocstyle src/doevc_s001

      - name: Run MyPy
        run: mypy src/doevc_s001

      - name: Run Pyright
        run: pyright src/doevc_s001

      - name: Run Pytest
        run: pytest

      - name: Run Bandit
        run: bandit -q -r src/doevc_s001

      - name: Build documentation
        run: python -m pdoc doevc_s001 -o site

      - name: Upload generated documentation
        uses: actions/upload-artifact@v4
        with:
          name: doevc-s001-docs
          path: secuencia/s001/site/
