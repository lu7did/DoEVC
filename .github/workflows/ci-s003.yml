name: ci-s003

on:
  pull_request:
    paths: [".github/workflows/ci-s003.yml", "secuencia/s003/**", "!secuencia/s003/script/**", "!secuencia/s003/ejemplos/**"]
  push:
    branches: [main]
    paths: [".github/workflows/ci-s003.yml", "secuencia/s003/**", "!secuencia/s003/script/**", "!secuencia/s003/ejemplos/**"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: secuencia/s003}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -r requirements-dev.txt
      - run: pre-commit run --all-files
      - run: pyright
      - run: pytest
      - run: python -m pdoc doevc_s003 -o site
