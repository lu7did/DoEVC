name: ci

on:
  pull_request:
    paths-ignore:
      - "script/**"
      - "ejemplos/**"
  push:
    branches:
      - main
    paths-ignore:
      - "script/**"
      - "ejemplos/**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check src tests

      - name: Run Black
        run: black --check src tests

      - name: Validate docstrings
        run: pydocstyle src/doEVC

      - name: Run MyPy
        run: mypy src/doEVC

      - name: Run Pyright
        run: pyright src/doEVC

      - name: Run Pytest
        run: pytest

      - name: Run Bandit
        run: bandit -q -r src/doEVC

      - name: Build documentation
        run: python -m pdoc doEVC -o site

      - name: Upload generated documentation
        uses: actions/upload-artifact@v4
        with:
          name: doevc-docs
          path: site/
