[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doevc-s003"
version = "1.0.0"
description = "Independent third DoEVC sequence."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "CC0-1.0" }
dependencies = []

[project.optional-dependencies]
dev = ["black>=24.10.0", "hypothesis>=6.112.1", "mypy>=1.11.2", "pdoc>=15.0.0", "pre-commit>=4.0.0", "pylint>=3.3.0", "pyright>=1.1.390", "pytest>=8.3.3", "pytest-cov>=5.0.0", "ruff>=0.6.9"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
target-version = ["py313"]
extend-exclude = "^(script|ejemplos)/"

[tool.ruff]
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["script", "ejemplos", "site"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--cov=doevc_s003", "--cov-report=term-missing", "--cov-fail-under=80"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["doevc_s003"]

[tool.pylint.main]
py-version = "3.13"
