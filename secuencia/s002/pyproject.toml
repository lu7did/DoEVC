[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doevc-s002"
version = "1.0.0"
description = "Second-cycle deterministic model for DoEVC."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "CC0-1.0" }
authors = [{ name = "UADER PI-B 230/24" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "black>=24.10.0",
    "hypothesis>=6.112.1",
    "pdoc>=15.0.0",
    "pre-commit>=4.0.0",
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.9",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py313"]
extend-exclude = "^(script|ejemplos)/"

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["script", "ejemplos", "site"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=doevc_s002",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]

[tool.coverage.run]
source = ["src/doevc_s002"]
